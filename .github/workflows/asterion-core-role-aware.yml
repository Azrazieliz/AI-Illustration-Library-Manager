name: Asterion Core role-aware validation

on:
  push:
    branches:
      - fix/asterion-role-aware-bindings
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Compile debug unit tests
        run: ./gradlew :app:compileDebugUnitTestKotlin --no-daemon --max-workers=1 --console=plain
      - name: Model package inspector regression tests
        run: ./gradlew :app:testDebugUnitTest --tests com.ailm.android.runtime.ai.ModelPackageInspectorRegressionTest --no-daemon --max-workers=1 --console=plain
      - name: Model package inspector unit tests
        run: ./gradlew :app:testDebugUnitTest --tests com.ailm.android.runtime.ai.ModelPackageInspectorTest --no-daemon --max-workers=1 --console=plain

name: Asterion Core Android Build

on:
  push:
    branches:
      - standalone-android
      - asterion-core-freeze-validation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Android unit tests
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugUnitTestKotlin --stacktrace

      - name: Run focused multi-artifact regression
        working-directory: android_app
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.ailm.android.runtime.ai.ModelPackageInspectorMultiArtifactRegressionTest" \
            --stacktrace

      - name: Run ModelPackageInspector regressions
        working-directory: android_app
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.ailm.android.runtime.ai.ModelPackageInspectorTest" \
            --tests "com.ailm.android.runtime.ai.ModelPackageInspectorRegressionTest" \
            --stacktrace

      - name: Run relevant model runtime contract tests
        working-directory: android_app
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.ailm.android.runtime.ai.BuffaloLExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.Florence2ExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.AestheticScoringExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.PaddleOcrExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.QwenLlamaCppContractTest" \
            --tests "com.ailm.android.runtime.ai.NomicTextExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.NomicVisionExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.BgeRerankerExecutionContractTest" \
            --tests "com.ailm.android.runtime.ai.NsfwOnnxContractTest" \
            --stacktrace

      - name: Run all Android unit tests
        working-directory: android_app
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android_app
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Compile release APK
        working-directory: android_app
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AsterionCore-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

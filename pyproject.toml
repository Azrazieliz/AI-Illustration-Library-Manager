[tool.poetry]
name = "ai-illustration-library-manager"
version = "0.1.0"
description = "Production-grade AI Illustration Library Manager"
authors = ["Azrael"]

packages = [
    { include = "engine" }
]

[tool.poetry.dependencies]
python = "^3.14"

sqlalchemy = "^2.0"
alembic = "^1.16"
pydantic = "^2.11"
pydantic-settings = "^2.10"

numpy = "^2.3"
opencv-python = "^4.12"

pillow = "^11.3"

faiss-cpu = "^1.12"

onnxruntime = "^1.22"

pyyaml = "^6.0"

structlog = "^25.4"

watchdog = "^6.0"

typer = "^0.17"

rich = "^14.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
ruff = "^0.12"
black = "^25.1"
mypy = "^1.17"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
    "."
]
